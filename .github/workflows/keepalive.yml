name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase-databasen
        run: |
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4am1jdXF3emR2dmh5bXFhZWppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2NTM3OTUsImV4cCI6MjA4ODIyOTc5NX0.axvucvLtar12xssiigYtwZuRZSLOA-XhX2Day7oqG6g"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors \
            "https://bxjmcuqwzdvvhymqaeji.supabase.co/rest/v1/tools?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"
          echo "Ping OK"
